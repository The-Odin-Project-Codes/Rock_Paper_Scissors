<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Paper Scissors</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #f4f7ff 0%, #eef2ff 50%, #f8f5ff 100%);
      color: #1f2937;
    }

    .game-card {
      width: min(640px, 100%);
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 20px 45px -24px rgba(31, 41, 55, 0.35);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 2.4vw, 2.2rem);
      letter-spacing: 0.3px;
    }

    .subtitle {
      margin: 10px 0 22px;
      color: #6b7280;
      font-size: 0.98rem;
    }

    .choices {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .choice-btn {
      border: 1px solid #dbe2ff;
      border-radius: 12px;
      background: #ffffff;
      color: #111827;
      font-size: 1.02rem;
      font-weight: 600;
      padding: 12px 18px;
      min-width: 120px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .choice-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: #b6c5ff;
      box-shadow: 0 8px 20px -12px rgba(37, 99, 235, 0.5);
    }

    .choice-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .choice-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #result,
    #score,
    #winner {
      border-radius: 12px;
      padding: 12px 14px;
      margin: 10px 0;
    }

    #result {
      background: #f9fafb;
      color: #374151;
      min-height: 48px;
      display: grid;
      align-content: center;
    }

    #score {
      background: #eef2ff;
      color: #3730a3;
      font-weight: 600;
    }

    #winner {
      background: #ecfdf3;
      color: #166534;
      font-weight: 700;
      min-height: 48px;
      display: grid;
      align-content: center;
    }
  </style>
</head>
<body>
  <main class="game-card">
    <h1>Rock Paper Scissors</h1>
    <p class="subtitle">First to 5 points wins the game.</p>

    <div class="choices">
      <button class="choice-btn" id="rock">🪨 Rock</button>
      <button class="choice-btn" id="paper">📄 Paper</button>
      <button class="choice-btn" id="scissors">✂️ Scissors</button>
    </div>

    <div id="result">Choose your move to start!</div>
    <div id="score">Score - You: 0, Computer: 0</div>
    <div id="winner"></div>
  </main>

  <script src="script.js" ></script>
</body>
</html>
